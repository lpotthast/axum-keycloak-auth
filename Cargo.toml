[package]
name = "axum-keycloak-auth"
version = "0.9.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lpotthast/axum-keycloak-auth"
documentation = "https://docs.rs/axum-keycloak-auth"
description = """
Protect axum routes with a JWT emitted by Keycloak.
"""
categories = ["authentication", "web-programming"]
keywords = ["keycloak", "auth", "jwt", "oidc", "axum"]
include = [
    "/src/",
    "/tests/",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]

[package.metadata.docs.rs]
features = ["aws-lc-rs"]

# The crate does not compile without one of the crypto backend features, and neither is a default.
# Enable exactly one, see the README section "Crypto backend".
[features]
# Verify token signatures with jsonwebtoken's aws-lc-rs crypto backend.
aws-lc-rs = ["jsonwebtoken/aws_lc_rs"]
# Verify token signatures with jsonwebtoken's RustCrypto crypto backend.
rust-crypto = ["jsonwebtoken/rust_crypto"]

[dependencies]
axum = { version = "0.8.1", default-features = false, features = ["json"] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
http = { version = "1.2.0", default-features = false, features = ["std"] }
jsonwebtoken = { version = "11.1.0", default-features = false }
nonempty = { version = "0.12.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde-querystring = { version = "0.3.0", default-features = false }
serde_json = { version = "1.0.134", default-features = false, features = ["std"] }
serde_with = { version = "3.12.0", default-features = false, features = ["macros", "std"] }
snafu = { version = "0.9.2", default-features = false, features = ["std"] }
time = { version = "0.3.37", default-features = false, features = ["std"] }
tokio = { version = "1.42.0", default-features = false, features = ["rt", "sync", "time"] }
tower = { version = "0.5.2", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["attributes", "std"] }
try-again = { version = "0.2.0", default-features = false, features = ["async-tokio"] }
typed-builder = { version = "0.23.2", default-features = false }
url = { version = "2.5.4", default-features = false, features = ["std"] }
uuid = { version = "1.11.0", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
assertr = { version = "0.9.1", default-features = false, features = ["http", "partial", "serde-json", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "macros", "tokio"] }
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
futures = { version = "0.3.31", default-features = false, features = ["async-await", "executor", "std"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem"] }
keycloak = { version = "26.6.2", default-features = false, features = ["reqwest", "tag-realms-admin"] }
testcontainers = { version = "0.28.0", default-features = false }
tokio = { version = "1.42.0", default-features = false, features = ["macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tower-http = { version = "0.7.0", default-features = false, features = ["trace"] }
tracing-core = { version = "0.1.36", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
uuid = { version = "1.24.1", default-features = false, features = ["serde", "std", "v7"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
