[package]
name = "axum-keycloak-auth"
version = "0.9.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lpotthast/axum-keycloak-auth"
documentation = "https://docs.rs/axum-keycloak-auth"
description = """
Protect axum routes with a JWT emitted by Keycloak.
"""
categories = ["authentication", "web-programming"]
keywords = ["keycloak", "auth", "jwt", "oidc", "axum"]
include = [
    "/src/",
    "/tests/",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]

[package.metadata.docs.rs]
features = ["aws-lc-rs"]

# The crate does not compile without one of the crypto backend features, and neither is a default.
# Enable exactly one, see the README section "Crypto backend".
[features]
# Verify token signatures with jsonwebtoken's aws-lc-rs crypto backend.
aws-lc-rs = ["jsonwebtoken/aws_lc_rs"]
# Verify token signatures with jsonwebtoken's RustCrypto crypto backend.
rust-crypto = ["jsonwebtoken/rust_crypto"]

[dependencies]
axum = "0.8.1"
futures = "0.3.31"
http = "1.2.0"
jsonwebtoken = { version = "11.1.0", default-features = false }
nonempty = { version = "0.12.0", features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = "1.0.228"
serde-querystring = "0.3.0"
serde_json = "1.0.134"
serde_with = "3.12.0"
snafu = { version = "0.9.2", default-features = false, features = ["std"] }
time = "0.3.37"
tokio = { version = "1.42.0", features = ["rt", "sync", "time"] }
tower = "0.5.2"
tracing = "0.1.41"
try-again = "0.2.0"
typed-builder = "0.21.0"
url = "2.5.4"
uuid = { version = "1.11.0", features = ["v7"] }

[dev-dependencies]
assertr = { version = "0.9.1", features = ["http", "partial", "serde-json"] }
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.0"
jsonwebtoken = { version = "11.1.0", features = ["use_pem"] }
keycloak = "26.6.2"
testcontainers = "0.28.0"
tokio = { version = "1.42.0", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing-core = "0.1.36"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.1", features = ["v7", "serde"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
